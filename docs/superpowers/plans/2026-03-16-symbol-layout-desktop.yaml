title: SymbolLayout 桌面版實作計畫
date: 2026-03-16
spec: docs/superpowers/specs/2026-03-16-symbol-layout-desktop-design.yaml

goal: |
  將 SymbolLayout 從 flex 佈局改寫為 absolute 定位，支援手機版 (344×440) 和桌面版 (520×665) 雙尺寸。

architecture: |
  SymbolLayout 改為渲染完整卡片（header + 格子 + 裝飾 + 財神 + footer），ScratchCard 對 symbol 機制退化為純邏輯 wrapper。
  新增 useIsDesktop hook 偵測 breakpoint。格子尺寸/定位/裝飾數據以常數物件儲存在 shared.tsx。
  SymbolLayout 維持純 presentational component（不直接存取 store），revealCard 經由擴展的 ThemeLayoutProps 傳入。

tech_stack: React 19, TailwindCSS 4, TypeScript strict

prechecks:
  - check: "grep getThemeLayout src/ — 確認只有 ScratchCard.tsx 呼叫"
    result: "✅ 只有 ScratchCard.tsx:2 (import) + ScratchCard.tsx:31 (呼叫)，themes/index.ts:21 (定義)"
    date: 2026-03-17

  - check: "symbol mechanic 的 cellsPerZone 是否永遠為 4 — 確認後可移除 fallback 路徑"
    result: |
      ⚠️ cellsPerZone 非固定值。SymbolOptions.cellsPerZone: number (1–9)。
      但 FEATURES.FIXED_CARD_SIZES=true 時 HostPage 隱藏輸入框，預設 4（FIXED_SIZE_DEFAULTS.cellsPerZone）。
      結論：目前產品行為固定 4 格，但型別允許 1–9。
      決策：SymbolLayout fullCard 模式只在 cellsPerZone=4 時啟用；非 4 格時走原有 ScratchCard 通用渲染。
    date: 2026-03-17

file_structure:
  - file: src/hooks/useIsDesktop.ts
    action: 新增
    responsibility: "useSyncExternalStore 封裝 matchMedia('(min-width: 768px)')，含 getServerSnapshot=false"

  - file: src/themes/wealth-god/shared.tsx
    action: 修改
    responsibility: |
      移除 SYMBOL_CELL_SIZES + symbolCellSize + getCellPerturbation import（getCellPerturbation 本體留在 canvas-utils.ts 不動）。
      新增 SymbolLayoutConfig / CellSlot / DecorationItem interface。
      新增 SYMBOL_MOBILE、SYMBOL_DESKTOP 常數（含 card/border/container/cells/decorations/caishen/title/titleArea/helpText/button/textStroke/boxShadow）。
      裝飾數據以 DecorationItem[] 存在常數中（避免 SymbolLayout 超過 400 行）。

  - file: src/themes/wealth-god/SymbolLayout.tsx
    action: 重寫
    responsibility: |
      完整卡片渲染：wrapper + header + 格子（absolute）+ 裝飾（map over decorations）+ 財神 + footer。
      useIsDesktop() 選擇 SYMBOL_MOBILE 或 SYMBOL_DESKTOP。
      不直接存取 store — revealCard 由 props 傳入。

  - file: src/types/index.ts
    action: 修改
    responsibility: |
      ThemeLayoutProps 新增 revealCard?: (cardId: string) => void。
      新增 ThemeLayoutEntry { component, fullCard? } interface。

  - file: src/themes/index.ts
    action: 修改
    responsibility: |
      themeRegistry 改用 ThemeLayoutEntry。symbol = { component: SymbolLayout, fullCard: true }。
      getThemeLayout 回傳 ThemeLayoutEntry。

  - file: src/components/play/ScratchCard.tsx
    action: 修改
    responsibility: |
      entry.fullCard 為 true 時渲染 <Layout revealCard={revealCard} />，不包 header/footer。
      移除 w-full sm:w-fit（fullCard 分支由 Layout 控制寬度；非 fullCard 分支暫不動）。

  - file: src/components/play/ScratchCard.test.tsx
    action: 修改
    responsibility: "調整 symbol 測試 DOM 選擇器（data-testid 由 SymbolLayout 渲染）"

phases:
  - id: 1
    name: 資料層 — layout 常數 + useIsDesktop
    tasks:
      - id: 1
        name: 新增 useIsDesktop hook
        files: [src/hooks/useIsDesktop.ts]
        steps:
          - "建立 hook：useSyncExternalStore + matchMedia，含 getServerSnapshot = false"
          - "不寫單元測試（純 browser API 封裝，CLAUDE.md 測試責任分界）"
          - "npx tsc --noEmit 驗證編譯"

      - id: 2
        name: 替換 shared.tsx 的 symbolCellSize
        files: [src/themes/wealth-god/shared.tsx]
        steps:
          - "移除 SYMBOL_CELL_SIZES、symbolCellSize、getCellPerturbation import（getCellPerturbation 本體在 canvas-utils.ts 不動，ScratchCellCanvas/BingoCellCanvas 仍使用）"
          - "新增 CellSlot interface（w/h/top/bottom/left/right/rotation/clipPath）"
          - "新增 DecorationItem interface（type/top/bottom/left/right/fontSize/rotation/opacity/w/h/extra）"
          - "新增 SymbolLayoutConfig interface（card/border/container/cells/decorations/caishen/title/titleArea/helpText/button/textStroke/boxShadow）"
          - "新增 SYMBOL_MOBILE 常數：所有手機版數值來自 spec + 裝飾座標從 v15 mockup HTML 提取"
          - "新增 SYMBOL_DESKTOP 常數：所有桌面版數值來自 spec + 裝飾座標從 desktop-v1 mockup HTML 提取"
          - "npx tsc --noEmit（預期 FAIL — SymbolLayout.tsx 還在 import symbolCellSize）"

      - id: 3
        name: Commit Phase 1
        commit: "refactor: replace symbolCellSize with SYMBOL_LAYOUT constants + add useIsDesktop hook"
        files: [src/hooks/useIsDesktop.ts, src/themes/wealth-god/shared.tsx]

  - id: 2
    name: SymbolLayout 重寫 + ScratchCard 適配
    tasks:
      - id: 4
        name: 重寫 SymbolLayout.tsx
        files: [src/themes/wealth-god/SymbolLayout.tsx]
        steps:
          - "useIsDesktop() 選擇 SYMBOL_MOBILE 或 SYMBOL_DESKTOP"
          - "渲染外層 wrapper：固定寬高、金邊框(#e8b828)、紅漸層背景、斜紋(10px/12px 固定不放大)"
          - "data-testid='scratch-card-{cardId}' 加在外層 wrapper"
          - "渲染 header：NT$價格+序號(上排) / 財神報到+頭獎N萬(下排)，Dela Gothic One"
          - "頭獎格式化：maxPrize >= 10000 → (maxPrize/10000)+'萬'，否則直接顯示"
          - "渲染格子 container：absolute 定位，map over layout.cells，clip-path + rotation，ScratchCellCanvas 傳入 per-cell w/h"
          - "渲染裝飾：map over layout.decorations（從常數讀取，不 hardcode）"
          - "渲染財神：caishen.png，wrapper 尺寸+定位從常數讀取"
          - "渲染底部：說明文字(absolute) + 一鍵刮開按鈕(absolute, Noto Serif TC 700)，onClick={() => revealCard(card.id)}（revealCard 從 props 取）"
          - "渲染中獎結果：card.status === completed 時替換按鈕顯示結果"
          - "非 4 格 fallback：確認 symbol 的 cellsPerZone 固定為 4 後移除；若不固定則保留 flex-wrap fallback"
          - "npx tsc --noEmit 驗證編譯"

      - id: 5
        name: 更新型別 + theme registry
        files: [src/types/index.ts, src/themes/index.ts]
        steps:
          - "types/index.ts：ThemeLayoutProps 新增 revealCard?: (cardId: string) => void"
          - "types/index.ts：新增 ThemeLayoutEntry { component: ComponentType<ThemeLayoutProps>; fullCard?: boolean }"
          - "themes/index.ts：ThemeLayoutMap 改用 ThemeLayoutEntry"
          - "symbol entry 加 fullCard: true，其他三個不加（{ component: XxxLayout }）"
          - "getThemeLayout 回傳 ThemeLayoutEntry"
          - "npx tsc --noEmit（預期 FAIL — ScratchCard 使用方式需更新）"

      - id: 6
        name: 更新 ScratchCard.tsx
        files: [src/components/play/ScratchCard.tsx]
        steps:
          - "const entry = getThemeLayout(themeId, mechanic)"
          - "fullCard 啟用條件：entry.fullCard && cellsPerZone === 4（precheck 結論：非 4 格走原有通用渲染）"
          - "條件成立 → return <entry.component card/cardTypeConfig/config/maxPrize revealCard={revealCard} />"
          - "else → const Layout = entry.component; 原有 header/footer 邏輯不變"
          - "fullCard 分支不加 w-full sm:w-fit（SymbolLayout 自己控制寬度）"
          - "npx tsc --noEmit 驗證 PASS"

      - id: 7
        name: Commit Phase 2
        commit_split:
          - commit: "refactor: add ThemeLayoutEntry + fullCard flag to theme registry"
            files: [src/types/index.ts, src/themes/index.ts, src/components/play/ScratchCard.tsx]
          - commit: "feat(visual): SymbolLayout full-card rewrite — absolute positioning + mobile/desktop dual-size"
            files: [src/themes/wealth-god/SymbolLayout.tsx]

  - id: 3
    name: 測試更新 + 驗證
    tasks:
      - id: 8
        name: 更新 ScratchCard.test.tsx
        files: [src/components/play/ScratchCard.test.tsx]
        steps:
          - "symbol 測試：data-testid 仍為 scratch-card-{cardId}（由 SymbolLayout 渲染）"
          - "一鍵刮開按鈕查詢不變（getByRole button name /一鍵刮開/）"
          - "中獎結果 data-testid=card-result 由 SymbolLayout 渲染"
          - "bingo 測試不變（ScratchCard 仍用 header/footer 包裝）"
          - "npx vitest run 驗證 PASS"

      - id: 9
        name: Commit Phase 3
        commit: "test: update ScratchCard tests for fullCard layout delegation"
        files: [src/components/play/ScratchCard.test.tsx]

  - id: 4
    name: 手動驗證
    tasks:
      - id: 10
        name: 瀏覽器驗證
        steps:
          - "手機版 (<768px)：344×440 卡片，absolute 格子，裝飾，財神"
          - "桌面版 (≥768px)：520×665 卡片，放大的格子/字體/裝飾"
          - "格子4 vs 財神是否重疊"
          - "Canvas 解析度是否清晰"
          - "斜紋密度一致 (10px/12px)"
          - "一鍵刮開 + 中獎結果功能正常"
          - "其他三個玩法（triple/compare/bingo）不受影響"
